name: CI Build & Automated Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
        dotnet-quality: 'preview'

    - name: Restore dependencies
      run: dotnet restore WebQLCHCF.slnx

    - name: Build Solution
      run: dotnet build WebQLCHCF.slnx --no-restore -c Release

    - name: Execute Automated Unit Tests
      run: dotnet test WebQLCHCF.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage"
